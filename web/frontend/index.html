<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Super Game</title>
  <!-- "Add to Home Screen" opens it without browser bars (L83: the field is
       height-bound on phones, so the bars cost it size). -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Super Game" />
  <meta name="theme-color" content="#05060f" />
  <link rel="apple-touch-icon" href="/src/icons/apple-touch-icon.png" />
</head>

<body>
  <canvas id="stars"></canvas>

  <main id="layout" data-screen="menu">

    <aside id="hud-left" class="hud-side">
    </aside>

    <section id="center">
      <div id="hud-global">
        <div id="boss-bar" hidden>
          <span class="label">BOSS</span>
          <div class="track">
            <div class="fill"></div>
          </div>
        </div>
      </div>

      <div id="field">
        <canvas id="game"></canvas>
      </div>
    </section>

    <aside id="hud-right" class="hud-side"></aside>

    <!-- Touch controls (L83): shown by CSS on touch-only devices in a match.
         data-button names the input; tabindex -1 keeps them out of MenuNav. -->
    <div id="touch-move" class="touch-pad">
      <button type="button" class="touch-btn" data-button="left" tabindex="-1" aria-label="Move left">◀</button>
      <button type="button" class="touch-btn" data-button="right" tabindex="-1" aria-label="Move right">▶</button>
    </div>

    <div id="touch-fire" class="touch-pad">
      <button type="button" class="touch-btn fire" data-button="shoot" tabindex="-1">Fire</button>
    </div>

    <button type="button" id="touch-pause" class="touch-btn" data-button="pause" tabindex="-1"
      aria-label="Pause"></button>

  </main>

  <div id="menu-overlay" hidden>
    <div class="menu-card panel">
      <h1 class="menu-title"></h1>
      <p class="menu-subtitle"></p>
      <div class="menu menu-items"></div>
    </div>
  </div>

  <div id="end-overlay" hidden>
    <div class="end-card panel">
      <h1 class="end-title"></h1>
      <p class="end-subtitle"></p>
      <div class="end-teams"></div>
      <p class="end-total"></p>

      <div class="menu end-actions">
        <button type="button" class="btn" data-action="restart">Play again</button>
        <button type="button" class="btn secondary" data-action="menu">Main menu</button>
      </div>
    </div>
  </div>

  <div id="lobby-overlay" hidden>
    <div class="lobby-card panel">
      <h1 class="lobby-title"></h1>
      <p class="lobby-subtitle"></p>
      <div class="lobby-groups"></div>
      <p class="lobby-status"></p>

      <div class="menu lobby-actions">
        <button type="button" class="btn secondary" data-action="leave" data-key="leave">Leave</button>
      </div>
    </div>
  </div>


  <!-- Touch-only devices held upright: CSS only, landscape is the only layout -->
  <div id="rotate-notice">
    <div class="notice-card panel">
      <h1 class="notice-title">Turn sideways</h1>
      <p class="notice-text">Super Game plays in landscape. Rotate your phone to continue.</p>
    </div>
  </div>

  <!-- Toasts (ui/toast.ts): above every overlay, never focused -->
  <div id="toasts"></div>

  <template id="player-hud-template">
    <div class="player-hud">
      <div class="name"></div>
      <div class="row"><img src="/heart.png" alt="" /><span class="lives"></span></div>
      <div class="row"><img src="/star.png" alt="" /><span class="points"></span></div>
    </div>
  </template>

  <!-- End screen: one block per team (coop is a single, unnamed one) -->
  <template id="end-team-template">
    <section class="end-team">
      <h2 class="end-team-name"></h2>
      <ol class="end-rows"></ol>
    </section>
  </template>

  <template id="end-row-template">
    <li class="end-row">
      <span class="end-row-name"></span>
      <span class="end-row-stats"></span>
    </li>
  </template>


  <!-- Lobby: one group per team (coop is a single, unnamed one), one seat per slot -->
  <template id="lobby-group-template">
    <section class="lobby-group">
      <h2 class="lobby-group-name"></h2>
      <ol class="lobby-seats"></ol>
    </section>
  </template>

  <template id="lobby-seat-template">
    <li class="lobby-seat">
      <span class="lobby-seat-name"></span>
      <span class="lobby-seat-tag">You</span>
      <span class="lobby-seat-state"></span>
      <div class="lobby-seat-actions"></div>
    </li>
  </template>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
