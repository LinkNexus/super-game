<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Game</title>
  <style>
    html {
      background: #000;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      display: grid;
      place-items: center;
    }

    /* Drawn at the sim's SCREEN_WIDTH x SCREEN_HEIGHT, scaled to fit. */
    canvas {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }

    #stars {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
    }

    #game {
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15), 0 0 40px rgba(80, 120, 255, 0.15);
    }
  </style>
</head>

<body>
  <canvas id="stars"></canvas>
  <canvas id="game"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
