<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Game</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
      }
      body {
        display: grid;
        place-items: center;
      }
      /* Drawn at the sim's SCREEN_WIDTH x SCREEN_HEIGHT, scaled to fit. */
      canvas {
        max-width: 100vw;
        max-height: 100vh;
        aspect-ratio: 1000 / 800;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="1000" height="800"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
