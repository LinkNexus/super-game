name: CI

# Master pushes (post-merge), PRs targeting master, and version tags (v*)
# trigger this - not every push on every branch. Keeps runner minutes and
# artifact storage bounded instead of growing with every WIP push on
# feature branches. Tag pushes are what cut an actual GitHub Release (see
# publish-release below) - everyday master-push artifacts stay short-lived.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

# Superseding a PR/branch with a new push cancels the older, now-stale run
# instead of letting it finish and waste minutes/storage.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Artifacts (client binaries bundle ~52MB of game audio each) are only
# uploaded for master pushes and version tags - the "official" build history.
# PRs still compile on every job below (so breakage is caught before merge),
# they just don't persist any output, since a PR build is superseded the
# moment it merges anyway.
env:
  IS_MASTER_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

# One toolchain for every Linux job: GCC 14.2 from Debian trixie, the same
# base image the Dockerfile ships the server on (its DEBIAN_IMAGE default -
# keep the two in sync). Native and MinGW come from the same distro, so the
# test, client, Windows and server builds all use the same GCC. Bumping GCC
# means changing `image:` below plus that one Dockerfile line. macOS stays on
# Apple clang. The container runs as root (no sudo), git must exist before
# checkout or submodules silently fail, and `safe.directory '*'` covers the
# submodule repos, which the runner user owns rather than root.
jobs:
  # Both test suites (shared/ simulation + the server's matchmaking/lifetime
  # logic via supergame-server-lib and fake sockets), in one job: GCC 14 with
  # ASan + UBSan. Build and Run are separate steps so a red check says which
  # kind of failure it is.
  #
  # - Build red: a compiler / C++-version problem. Newer GCC keeps turning
  #   quietly ill-formed code into hard errors - e.g. GCC 14's
  #   -Wchanges-meaning rejecting a member alias in PvPGameSim that named the
  #   unqualified namespace-scope template ([basic.scope.class]), which clang
  #   accepted. Same GCC as every other job (see the note above `jobs:`).
  # - Run red: a failing test, or undefined behaviour -Werror can't see, e.g.
  #   L64's test_lobby.cpp stack-use-after-scope (a std::get_if pointer into a
  #   dead temporary) that passed on clang and only differed on GCC by stack
  #   layout. -fno-sanitize-recover=all (see the preset) makes a UBSan finding
  #   exit non-zero.
  #
  # GCC, not clang: clang 18 + libstdc++ 14 wrongly rejects
  # std::optional<Team>::emplace() (is_constructible_v<Team> false while the
  # builtin says true) - a toolchain bug, absent with clang + libc++.
  #
  # No submodules: `tests-asan` inherits `tests` (BUILD_CLIENT=OFF,
  # BUILD_SERVER=OFF), and supergame-server-lib names no uWS type. The id stays
  # `test-shared` because docker-server and publish-release `needs:` it, so a
  # sanitizer finding blocks a deploy.
  test-shared:
    runs-on: ubuntu-latest
    # SYS_PTRACE: LeakSanitizer stops the world via ptrace at exit.
    container: &toolchain
      image: debian:trixie-slim
      options: --cap-add=SYS_PTRACE
    steps:
      - name: Install build deps
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git ca-certificates cmake ninja-build g++
          git config --global --add safe.directory '*'
          g++ --version

      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Build tests (GCC 14, ASan + UBSan)
        run: |
          cmake --preset tests-asan
          cmake --build --preset tests-asan

      - name: Run tests (ASan + UBSan)
        run: ctest --preset tests-asan

  build-client-linux:
    runs-on: ubuntu-latest
    container: *toolchain
    steps:
      - name: Install build deps
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git ca-certificates cmake ninja-build g++ python3 \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libasound2-dev
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          # Non-recursive top-level checkout, matching README.md: uWebSockets
          # and mbedtls bundle nested submodules (BoringSSL, lsquic, a fuzzing
          # corpus - 1GB+) this project doesn't use, so those are initialized
          # selectively below instead.
          submodules: true

      # Only mbedtls' `framework` is needed: it is required just to configure
      # mbedtls, which ixwebsocket links. uSockets is deliberately not
      # initialized - every client preset sets BUILD_SERVER=OFF, so
      # vendor/uWebSockets.cmake is never included.
      - name: Init nested submodules
        run: |
          git -C vendor/mbedtls submodule update --init framework

      - name: Cache build directories
        uses: actions/cache@v4
        with:
          path: |
            build/client
            build/client-release
          # Keyed on the build definition rather than the branch name: a
          # CMake/submodule change must invalidate the cache (the old key
          # never did), while an ordinary source edit should still hit it.
          # restore-keys lets a PR warm from the newest existing cache -
          # under the branch-name key, every PR started cold. The `trixie`
          # segment keeps objects from another compiler from being restored.
          key: client-linux-trixie-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'client/CMakeLists.txt', 'server/CMakeLists.txt', 'shared/CMakeLists.txt', 'shared/tests/CMakeLists.txt', 'server/tests/CMakeLists.txt', 'tests/harness/CMakeLists.txt', 'cmake/**', 'vendor/*.cmake', '.gitmodules') }}
          restore-keys: client-linux-trixie-

      - name: Build (debug, compile check)
        run: |
          cmake --preset client
          cmake --build --preset client

      - name: Build (release)
        run: |
          cmake --preset client-release
          cmake --build --preset client-release

      - name: Upload client-linux artifact
        if: env.IS_MASTER_PUSH == 'true' || env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: supergame-client-linux-${{ github.sha }}
          path: build/client-release/bin/
          retention-days: 14

  build-client-macos:
    # Apple Silicon (arm64) hosted runner - a genuine native build, not a
    # cross-compile trick like the Windows job below. Builds natively for
    # the runner's own arch only; producing an Intel or universal binary
    # too would need an explicit CMAKE_OSX_ARCHITECTURES, not done here.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Only mbedtls' `framework` is needed: it is required just to configure
      # mbedtls, which ixwebsocket links. uSockets is deliberately not
      # initialized - every client preset sets BUILD_SERVER=OFF, so
      # vendor/uWebSockets.cmake is never included.
      - name: Init nested submodules
        run: |
          git -C vendor/mbedtls submodule update --init framework

      - name: Install build deps
        run: brew install cmake ninja

      - name: Cache build directories
        uses: actions/cache@v4
        with:
          path: |
            build/client
            build/client-release
          key: client-macos-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'client/CMakeLists.txt', 'server/CMakeLists.txt', 'shared/CMakeLists.txt', 'shared/tests/CMakeLists.txt', 'server/tests/CMakeLists.txt', 'tests/harness/CMakeLists.txt', 'cmake/**', 'vendor/*.cmake', '.gitmodules') }}
          restore-keys: client-macos-

      - name: Build (debug, compile check)
        run: |
          cmake --preset client
          cmake --build --preset client

      - name: Build (release)
        run: |
          cmake --preset client-release
          cmake --build --preset client-release

      - name: Upload client-macos artifact
        if: env.IS_MASTER_PUSH == 'true' || env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: supergame-client-macos-${{ github.sha }}
          path: build/client-release/bin/
          retention-days: 14

  build-client-windows:
    runs-on: ubuntu-latest
    container: *toolchain
    steps:
      - name: Install cross-compile toolchain
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git ca-certificates cmake ninja-build python3 g++-mingw-w64-x86-64
          git config --global --add safe.directory '*'
          # Debian's mingw-w64 package ships both win32 and posix thread-model
          # variants; win32 doesn't implement std::thread/mutex/condition_variable
          # at all, which ixwebsocket needs.
          update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          x86_64-w64-mingw32-g++ --version

      - uses: actions/checkout@v4
        with:
          submodules: true

      # Only mbedtls' `framework` is needed: it is required just to configure
      # mbedtls, which ixwebsocket links. uSockets is deliberately not
      # initialized - every client preset sets BUILD_SERVER=OFF, so
      # vendor/uWebSockets.cmake is never included.
      - name: Init nested submodules
        run: |
          git -C vendor/mbedtls submodule update --init framework

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build/windows-client-release
          key: client-windows-trixie-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'client/CMakeLists.txt', 'server/CMakeLists.txt', 'shared/CMakeLists.txt', 'shared/tests/CMakeLists.txt', 'server/tests/CMakeLists.txt', 'tests/harness/CMakeLists.txt', 'cmake/**', 'vendor/*.cmake', '.gitmodules') }}
          restore-keys: client-windows-trixie-

      - name: Build
        run: |
          cmake --preset windows-client-release
          cmake --build --preset windows-client-release

      - name: Upload client-windows artifact
        if: env.IS_MASTER_PUSH == 'true' || env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: supergame-client-windows-${{ github.sha }}
          path: build/windows-client-release/bin/
          retention-days: 14

  # The only server build: the Dockerfile compiles it (Release, trixie GCC),
  # so what CI checks is exactly what ships. Runs on every event so PRs get
  # the compile check; pushing the image and the redeploy happen only on a
  # master push or a version tag - never from a PR (which may come from a fork
  # with no registry access anyway). Debug-only code (asserts) in shared/ and
  # the server lib is still compiled by test-shared.
  docker-server:
    runs-on: ubuntu-latest
    # Gated on the tests: this job fires the Dokploy redeploy webhook, so a
    # failing test must not be able to reach production.
    needs: [test-shared]
    env:
      DEPLOY: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init uWebSockets submodule
        run: |
          git submodule update --init vendor/uWebSockets
          git -C vendor/uWebSockets submodule update --init uSockets

      - name: Set lowercase image name
        # ghcr.io requires an all-lowercase path; github.repository preserves
        # the repo's actual casing (e.g. an uppercase owner name).
        run: |
          echo "IMAGE_NAME=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Compute image tags
        # sha + latest always; the version tag itself too (e.g. v1.0.0) when
        # this run was triggered by pushing a version tag, not a master push.
        run: |
          {
            echo "IMAGE_TAGS<<TAGEOF"
            echo "${IMAGE_NAME}:${GITHUB_SHA}"
            echo "${IMAGE_NAME}:latest"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "${IMAGE_NAME}:${GITHUB_REF_NAME}"
            fi
            echo "TAGEOF"
          } >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        if: env.DEPLOY == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The default "docker" buildx driver doesn't support the gha cache
      # exporter used below - needs the docker-container driver instead.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.DEPLOY == 'true' }}
          tags: ${{ env.IMAGE_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The VPS's Dokploy deployment tracks :latest - once a fresh image
      # lands (master push or a version tag, both retag :latest above),
      # this tells it to pull and redeploy. The URL itself is a bearer
      # credential (anyone with it can trigger a redeploy), so it's a
      # secret, never a literal in this public repo.
      - name: Trigger Dokploy redeploy
        if: env.DEPLOY == 'true'
        run: curl -fsS "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL }}"

  # Only runs on a version-tag push (v*) - bundles the artifacts the build
  # jobs above already produced (per the IS_RELEASE gate on their upload
  # steps) into a permanent GitHub Release, instead of leaving them to
  # expire after 14 days like ordinary master-push artifacts.
  publish-release:
    runs-on: ubuntu-latest
    needs:
      [
        test-shared,
        build-client-linux,
        build-client-macos,
        build-client-windows,
        docker-server,
      ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download client artifacts
        # Scoped patterns only - an unfiltered download-artifact also picks
        # up docker/build-push-action's own internal build-record artifact
        # (a "*.dockerbuild" one, not a real release asset), which isn't a
        # normal downloadable artifact and fails the whole step.
        uses: actions/download-artifact@v4
        with:
          pattern: supergame-client-*
          path: artifacts

      - name: Zip each artifact for the release
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            zip -rq "../${name}.zip" "$name"
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
